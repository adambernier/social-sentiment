name: Kani Formal Verification

on:
  push:
    branches: [ '**' ]
    paths:
      - 'crates/social-sentiment-math/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/kani.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'crates/social-sentiment-math/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/kani.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.94.0

    - name: Install and configure Kani
      run: |
        cargo install --locked kani-verifier --version 0.68.0
        cargo kani setup

    - name: Run Kani proofs on social-sentiment-math
      run: cargo kani -p social-sentiment-math -Z stubbing --output-format terse
