name: Run Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sentiment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentiment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_DSN: postgresql://postgres:test@localhost:5432/sentiment_test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip' # Caches pip dependencies automatically

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. Install service dependencies using their hashed lockfiles
        pip install --require-hashes \
                    -r api-service/requirements.txt \
                    -r market-producer/requirements.txt \
                    -r preprocessing-service/requirements.txt \
                    -r sentiment-service/requirements.txt \
                    -r storage-service/requirements.txt
        # 2. Install test framework packages (unhashed)
        pip install pytest pytest-asyncio

    - name: Run test suite
      run: |
        pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui-service
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: ui-service/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Audit frontend production dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Run frontend tests
      run: npm test

    - name: Type-check frontend
      run: npx tsc --noEmit

    - name: Lint frontend
      run: npm run lint -- --no-warn-ignored

    - name: Build frontend
      run: npm run build
