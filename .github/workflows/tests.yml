name: Run Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sentiment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentiment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_DSN: postgresql://postgres:test@localhost:5432/sentiment_test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip' # Caches pip dependencies automatically

    - name: Set up Rust for model parity
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.94.0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. Install service dependencies using their hashed lockfiles
        pip install --require-hashes \
                    -r api-service/requirements.txt \
                    -r archive-service/requirements.txt \
                    -r market-producer/requirements.txt \
                    -r preprocessing-service/requirements.txt \
                    -r sentiment-service/requirements.txt \
                    -r storage-service/requirements.txt
        # 2. Install test framework packages (unhashed)
        pip install pytest pytest-asyncio

    - name: Run test suite
      run: |
        pytest

    - name: Verify Python/Rust model parity
      run: python scripts/verify_model_parity.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui-service
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: ui-service/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Audit frontend production dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Run frontend tests
      run: npm test

    - name: Type-check frontend
      run: npx tsc --noEmit

    - name: Lint frontend
      run: npm run lint -- --no-warn-ignored

    - name: Build frontend
      run: npm run build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.94.0
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Lint Rust workspace
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Test Rust workspace
      run: cargo test --workspace --locked

    - name: Validate Compose configurations
      run: |
        docker compose config --quiet
        docker compose -f docker-compose.yml -f docker-compose.rust.yml config --quiet
        docker compose -f docker-compose.worker-qualification.yml config --quiet

  worker-qualification-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_WORKER_QUALIFICATION: "1"
      QUALIFICATION_BUILD: "0"

    steps:
    - name: Checkout repository and model fixtures
      uses: actions/checkout@v5
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: storage-service/requirements.txt

    - name: Install harness dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r storage-service/requirements.txt
        pip install pytest pytest-asyncio

    - name: Build isolated worker qualification images
      run: |
        docker compose -f docker-compose.worker-qualification.yml \
          --profile qualification build \
          schema-migrate \
          python-preprocessing rust-preprocessing \
          python-sentiment rust-sentiment \
          python-storage rust-storage

    - name: Run deterministic live worker smoke cases
      run: >-
        pytest -ra tests/worker_qualification
        -m worker_qualification_smoke
