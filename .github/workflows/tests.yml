name: Run Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip' # Caches pip dependencies automatically

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. Install service dependencies using their hashed lockfiles
        pip install --require-hashes \
                    -r api-service/requirements.txt \
                    -r preprocessing-service/requirements.txt \
                    -r sentiment-service/requirements.txt \
                    -r storage-service/requirements.txt
        # 2. Install test framework packages (unhashed)
        pip install pytest pytest-asyncio

    - name: Run test suite
      run: |
        pytest

