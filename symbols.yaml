# ==============================================================================
# Ticker Tracking Configuration
# ==============================================================================
# Add, remove, or modify the tickers you want the dashboard to track.
# The producers will automatically begin ingesting data for these symbols,
# and the API will dynamically adjust the leaderboard.
# 
# Fields:
#   - keywords: High-signal company or product names to look for alongside $CASHTAGS
#   - future: The primary futures ticker to correlate against (e.g., NQ=F for tech)
#   - sector: The sector ETF to compare performance against (e.g., XLK for tech)
#   - require_uppercase (optional): If true, strict-matches the ticker (e.g., SMH, not smh)
#   - block_phrases (optional): Reject posts containing these exact phrases (ignores case)
# ==============================================================================

