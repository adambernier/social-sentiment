[pytest]
pythonpath = . preprocessing-service sentiment-service storage-service market-producer archive-service
testpaths = tests
asyncio_mode = auto
markers =
    worker_qualification: live RabbitMQ/PostgreSQL worker qualification (opt-in)
    worker_qualification_smoke: deterministic worker qualification cases for CI
    worker_qualification_fault: destructive dependency and lifecycle qualification cases
    worker_qualification_gate: long replay, retention, or observation deployment gate
