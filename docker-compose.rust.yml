# Opt-in Rust worker/producer overlay. The base Compose file remains the
# one-command Python rollback. Apply this overlay and name only the service
# being promoted; service names, dependencies, environments and queues remain
# inherited from docker-compose.yml.
services:
  preprocessing-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-preprocessing

  sentiment-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-sentiment

  storage-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-storage

  bluesky-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-bluesky-producer

  stocktwits-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-stocktwits-producer

  reddit-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-reddit-producer

  finnhub-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-finnhub-producer

  alpaca-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-alpaca-producer

  market-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-market-producer

  global-events-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-global-events-producer

  # Side-by-side API candidate for contract, browser, and load gates. It does
  # not replace the Python api-service or change the frontend's API_URL.
  rust-api-service:
    profiles: ["rust-api"]
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-api
    environment:
      - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GLOBAL_CONTEXT_ENABLED=${GLOBAL_CONTEXT_ENABLED:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
