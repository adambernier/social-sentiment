# Opt-in Rust worker overlay. The Python API remains authoritative until the
# experimental Rust API passes the full route and response parity suite.
services:
  preprocessing-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-preprocessing

  sentiment-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-sentiment

  storage-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-storage

  # Side-by-side API candidate for contract, browser, and load gates. It does
  # not replace the Python api-service or change the frontend's API_URL.
  rust-api-service:
    profiles: ["rust-api"]
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-api
    environment:
      - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GLOBAL_CONTEXT_ENABLED=${GLOBAL_CONTEXT_ENABLED:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
