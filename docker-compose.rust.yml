# Compatibility overlay retained while hosts transition off
# `COMPOSE_FILE=docker-compose.yml:docker-compose.rust.yml`.
# `docker-compose.yml` now builds these Rust targets by default.
services:
  preprocessing-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-preprocessing

  sentiment-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-sentiment

  storage-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-storage

  bluesky-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-bluesky-producer

  stocktwits-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-stocktwits-producer

  reddit-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-reddit-producer

  finnhub-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-finnhub-producer

  alpaca-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-alpaca-producer

  market-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-market-producer

  global-events-producer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-global-events-producer

  api-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: rust-api
    environment:
      - RUST_LOG=${RUST_LOG:-info}
