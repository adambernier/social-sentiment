services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
    - 5672:5672
    - 15672:15672
    environment:
    - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
    - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:15
    environment:
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d sentiment
      interval: 5s
      timeout: 5s
      retries: 5
  preprocessing-service:
    build:
      context: .
      dockerfile: preprocessing-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  sentiment-service:
    build:
      context: .
      dockerfile: sentiment-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  bluesky-producer:
    build:
      context: .
      dockerfile: bluesky-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  stocktwits-producer:
    build:
      context: .
      dockerfile: stocktwits-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  reddit-producer:
    build:
      context: .
      dockerfile: reddit-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-social-sentiment-rss/0.1 (sentiment dashboard)}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  finnhub-producer:
    build:
      context: .
      dockerfile: finnhub-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  market-producer:
    build:
      context: .
      dockerfile: market-producer/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - ADMIN_API_KEY=${ADMIN_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
  ui-service:
    build:
      context: ui-service
      dockerfile: Dockerfile
    volumes:
    - ./ui-service:/app
    - /app/node_modules
    - /app/.next
    environment:
    - API_URL=http://api-service:8000
    - WATCHPACK_POLLING=true
    command: npm run dev
    depends_on:
    - api-service
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
    - 9090:9090
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:10.0.3
    environment:
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    - GF_AUTH_DISABLE_LOGIN_FORM=true
    - GF_SECURITY_ALLOW_EMBEDDING=true
    - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/SystemHealth.json
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
    - prometheus
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
    - ui-service
    - api-service
    - grafana
volumes:
  postgres_data: null
  caddy_data: null
  caddy_config: null
