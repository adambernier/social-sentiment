services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    environment:
    - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
    - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:15
    environment:
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d sentiment
      interval: 5s
      timeout: 5s
      retries: 5
  schema-migrate:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    command: ["python", "storage-service/migrate.py"]
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  preprocessing-service:
    build:
      context: .
      dockerfile: preprocessing-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  sentiment-service:
    build:
      context: .
      dockerfile: sentiment-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  bluesky-producer:
    build:
      context: .
      dockerfile: bluesky-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  stocktwits-producer:
    build:
      context: .
      dockerfile: stocktwits-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  reddit-producer:
    # Disabled by default -- Reddit can 403-block unauthenticated .json 
    # Re-enable with `docker compose --profile reddit up -d`
    # if we can get OAuth (oauth.reddit.com) is wired up
    profiles: ["reddit"]
    build:
      context: .
      dockerfile: reddit-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-social-sentiment-bot/1.0 (DigitalOcean; +github.com/adambernier/social-sentiment)}
    - REDDIT_PROXY_URL=${REDDIT_PROXY_URL}
    - REDDIT_POLL_INTERVAL=${REDDIT_POLL_INTERVAL:-900}
    - REDDIT_MAX_BACKOFF=${REDDIT_MAX_BACKOFF:-3600}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  finnhub-producer:
    build:
      context: .
      dockerfile: finnhub-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  alpaca-producer:
    build:
      context: .
      dockerfile: alpaca-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - ALPACA_API_KEY=${ALPACA_API_KEY}
    - ALPACA_API_SECRET=${ALPACA_API_SECRET}
    - ALPACA_URL=${ALPACA_URL}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  market-producer:
    build:
      context: .
      dockerfile: market-producer/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-social-sentiment-bot/1.0 (DigitalOcean; +github.com/adambernier/social-sentiment)}
    - REDDIT_PROXY_URL=${REDDIT_PROXY_URL}
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - ADMIN_API_KEY=${ADMIN_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  ui-service:
    build:
      context: ui-service
      dockerfile: Dockerfile
    environment:
    - API_URL=http://api-service:8000
    - WATCHPACK_POLLING=true
    depends_on:
    - api-service
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:10.0.3
    environment:
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    - GF_AUTH_DISABLE_LOGIN_FORM=false
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    - GF_SECURITY_ALLOW_EMBEDDING=true
    - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/SystemHealth.json
    - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
    - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
    - prometheus
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
    - SITE_ADDRESS=${SITE_ADDRESS}
    - ACME_EMAIL=${ACME_EMAIL}
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
    - ui-service
    - api-service
    - grafana
volumes:
  postgres_data: null
  caddy_data: null
  caddy_config: null
