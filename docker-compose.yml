services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    environment:
    - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
    - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 5
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    image: social-sentiment-postgres:15-walg-v3.0.8
    restart: unless-stopped
    environment:
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - WALG_ENABLED=${WALG_ENABLED:-false}
    - WALG_S3_PREFIX=${WALG_S3_PREFIX:-}
    - AWS_ENDPOINT=${SPACES_ENDPOINT:-}
    - AWS_REGION=${SPACES_REGION:-us-east-1}
    - AWS_ACCESS_KEY_ID=${SPACES_WALG_UPLOAD_ACCESS_KEY:-}
    - AWS_SECRET_ACCESS_KEY=${SPACES_WALG_UPLOAD_SECRET_KEY:-}
    - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-true}
    - WALG_COMPRESSION_METHOD=${WALG_COMPRESSION_METHOD:-zstd}
    - WALG_LIBSODIUM_KEY=${WALG_LIBSODIUM_KEY:-}
    - WALG_LIBSODIUM_KEY_TRANSFORM=${WALG_LIBSODIUM_KEY_TRANSFORM:-base64}
    - WALG_PREVENT_WAL_OVERWRITE=true
    - WALG_ARCHIVE_TIMEOUT=${WALG_ARCHIVE_TIMEOUT:-60s}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-restore-drill:
    profiles: ["restore"]
    build:
      context: .
      dockerfile: postgres/Dockerfile
    image: social-sentiment-postgres:15-walg-v3.0.8
    command: ["/usr/local/bin/restore-drill.sh"]
    environment:
    - POSTGRES_DB=${POSTGRES_DB}
    - WALG_ENABLED=false
    - WALG_S3_PREFIX=${WALG_S3_PREFIX:-}
    - AWS_ENDPOINT=${SPACES_ENDPOINT:-}
    - AWS_REGION=${SPACES_REGION:-us-east-1}
    - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-true}
    - WALG_COMPRESSION_METHOD=${WALG_COMPRESSION_METHOD:-zstd}
    - WALG_LIBSODIUM_KEY=${WALG_LIBSODIUM_KEY:-}
    - WALG_LIBSODIUM_KEY_TRANSFORM=${WALG_LIBSODIUM_KEY_TRANSFORM:-base64}
    - RESTORE_TARGET_TIME=${RESTORE_TARGET_TIME:-}
  archive-service:
    profiles: ["archive"]
    build:
      context: .
      dockerfile: archive-service/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - ANALYTICS_S3_PREFIX=${ANALYTICS_S3_PREFIX:-}
    - SPACES_ENDPOINT=${SPACES_ENDPOINT:-}
    - SPACES_REGION=${SPACES_REGION:-us-east-1}
    - AWS_ACCESS_KEY_ID=${SPACES_ANALYTICS_ACCESS_KEY:-}
    - AWS_SECRET_ACCESS_KEY=${SPACES_ANALYTICS_SECRET_KEY:-}
    - ANALYTICS_SSE_C_KEY_B64=${ANALYTICS_SSE_C_KEY_B64:-}
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  schema-migrate:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    command: ["python", "storage-service/migrate.py"]
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  preprocessing-service:
    build:
      context: .
      dockerfile: preprocessing-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - PYTHONUNBUFFERED=1
    - TOPIC_MODEL_VERSION=${TOPIC_MODEL_VERSION:-zero-shot-onnx-v1}
    - PIPELINE_GIT_COMMIT=${PIPELINE_GIT_COMMIT:-unknown}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  sentiment-service:
    build:
      context: .
      dockerfile: sentiment-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - SENTIMENT_MODEL_VERSION=${SENTIMENT_MODEL_VERSION:-fintwitbert-onnx-v1}
    - PIPELINE_GIT_COMMIT=${PIPELINE_GIT_COMMIT:-unknown}
    depends_on:
      rabbitmq:
        condition: service_healthy
  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - GLOBAL_CONTEXT_ENABLED=${GLOBAL_CONTEXT_ENABLED:-false}
    - POST_RETENTION_DAYS=${POST_RETENTION_DAYS:-14}
    - QUOTE_RETENTION_DAYS=${QUOTE_RETENTION_DAYS:-90}
    - RAW_ARCHIVE_PLATFORMS=${RAW_ARCHIVE_PLATFORMS:-}
    - RAW_ARCHIVE_SAMPLE_RATE=${RAW_ARCHIVE_SAMPLE_RATE:-0.01}
    - RAW_ARCHIVE_CHALLENGE_ENGAGEMENT=${RAW_ARCHIVE_CHALLENGE_ENGAGEMENT:-100}
    - RAW_ARCHIVE_CHALLENGE_ABS_SIGNAL=${RAW_ARCHIVE_CHALLENGE_ABS_SIGNAL:-0.8}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  bluesky-producer:
    build:
      context: .
      dockerfile: bluesky-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    - PIPELINE_GIT_COMMIT=${PIPELINE_GIT_COMMIT:-unknown}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  stocktwits-producer:
    build:
      context: .
      dockerfile: stocktwits-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    - PIPELINE_GIT_COMMIT=${PIPELINE_GIT_COMMIT:-unknown}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  reddit-producer:
    # Disabled by default -- Reddit can 403-block unauthenticated .json 
    # Re-enable with `docker compose --profile reddit up -d`
    # if we can get OAuth (oauth.reddit.com) is wired up
    profiles: ["reddit"]
    build:
      context: .
      dockerfile: reddit-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    - PIPELINE_GIT_COMMIT=${PIPELINE_GIT_COMMIT:-unknown}
    - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-social-sentiment-bot/1.0 (DigitalOcean; +github.com/adambernier/social-sentiment)}
    - REDDIT_PROXY_URL=${REDDIT_PROXY_URL}
    - REDDIT_POLL_INTERVAL=${REDDIT_POLL_INTERVAL:-900}
    - REDDIT_MAX_BACKOFF=${REDDIT_MAX_BACKOFF:-3600}
    - REDDIT_TRANSIENT_RETRY_INTERVAL=${REDDIT_TRANSIENT_RETRY_INTERVAL:-60}
    - REDDIT_TRANSIENT_RETRY_JITTER=${REDDIT_TRANSIENT_RETRY_JITTER:-15}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  finnhub-producer:
    build:
      context: .
      dockerfile: finnhub-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    - PIPELINE_GIT_COMMIT=${PIPELINE_GIT_COMMIT:-unknown}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  alpaca-producer:
    build:
      context: .
      dockerfile: alpaca-producer/Dockerfile
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - ALPACA_API_KEY=${ALPACA_API_KEY}
    - ALPACA_API_SECRET=${ALPACA_API_SECRET}
    - ALPACA_URL=${ALPACA_URL}
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - PYTHONUNBUFFERED=1
    - PIPELINE_GIT_COMMIT=${PIPELINE_GIT_COMMIT:-unknown}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  market-producer:
    build:
      context: .
      dockerfile: market-producer/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASS=${RABBITMQ_PASS}
    - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-social-sentiment-bot/1.0 (DigitalOcean; +github.com/adambernier/social-sentiment)}
    - REDDIT_PROXY_URL=${REDDIT_PROXY_URL}
    - GLOBAL_CONTEXT_ENABLED=${GLOBAL_CONTEXT_ENABLED:-false}
    - GLOBAL_MARKET_POLL_SECONDS=${GLOBAL_MARKET_POLL_SECONDS:-900}
    - GLOBAL_MARKET_MAX_CONCURRENCY=${GLOBAL_MARKET_MAX_CONCURRENCY:-2}
    - GLOBAL_MARKET_RATE_PER_MINUTE=${GLOBAL_MARKET_RATE_PER_MINUTE:-20}
    - GLOBAL_MARKET_MAX_BACKOFF=${GLOBAL_MARKET_MAX_BACKOFF:-14400}
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  global-events-producer:
    build:
      context: .
      dockerfile: global-events-producer/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - GLOBAL_CONTEXT_ENABLED=${GLOBAL_CONTEXT_ENABLED:-false}
    - GLOBAL_EVENTS_POLL_SECONDS=${GLOBAL_EVENTS_POLL_SECONDS:-900}
    - GLOBAL_EVENTS_MAX_PER_RULE_DAY=${GLOBAL_EVENTS_MAX_PER_RULE_DAY:-20}
    - GLOBAL_EVENTS_RATE_PER_MINUTE=${GLOBAL_EVENTS_RATE_PER_MINUTE:-10}
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    environment:
    - DATABASE_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - ADMIN_API_KEY=${ADMIN_API_KEY}
    - GLOBAL_CONTEXT_ENABLED=${GLOBAL_CONTEXT_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
  ui-service:
    build:
      context: ui-service
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GLOBAL_CONTEXT_ENABLED: ${GLOBAL_CONTEXT_ENABLED:-false}
    environment:
    - API_URL=http://api-service:8000
    - WATCHPACK_POLLING=true
    depends_on:
    - api-service
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:10.0.3
    environment:
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    - GF_AUTH_DISABLE_LOGIN_FORM=false
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    - GF_SECURITY_ALLOW_EMBEDDING=true
    - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/SystemHealth.json
    - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
    - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
    - prometheus
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
    - SITE_ADDRESS=${SITE_ADDRESS}
    - ACME_EMAIL=${ACME_EMAIL}
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
    - ui-service
    - api-service
    - grafana
volumes:
  postgres_data: null
  caddy_data: null
  caddy_config: null
