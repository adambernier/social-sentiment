[package]
name = "social-news-producer"
version = "0.1.0"
edition = "2021"

[lib]
name = "social_news_producer"

[[bin]]
name = "producer-bluesky"
path = "src/bin/bluesky.rs"

[[bin]]
name = "producer-stocktwits"
path = "src/bin/stocktwits.rs"

[[bin]]
name = "producer-reddit"
path = "src/bin/reddit.rs"

[[bin]]
name = "producer-finnhub"
path = "src/bin/finnhub.rs"

[[bin]]
name = "producer-alpaca"
path = "src/bin/alpaca.rs"

[dependencies]
